<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>採購工作看板</title>
<meta name="description" content="每日叫貨進度、每日工作打勾確認、團隊行事曆、兩關簽核、廠商產品查詢與原物料分析">
<meta name="theme-color" content="#2445a3">
<meta name="application-name" content="採購看板">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="採購看板">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script src="config.js"></script>
<script src="js/auth.js"></script>
<script src="js/cloud-store.js"></script>
<script src="js/app.js" defer></script>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="top-inner wrap">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="32" height="32">
        <h1>採購工作看板</h1>
        <button type="button" id="sync" class="sync" title="立即同步"><i aria-hidden="true"></i>連線中…</button>
      </div>
      <button class="btn primary" id="newOrderBtn" type="button" hidden>＋ 新增叫貨</button>
      <div class="me"><span class="lbl">登入：</span><b id="meName"></b><button class="btn ghost sm" id="logoutBtn" type="button">登出</button></div>
    </div>
    <nav class="tabs wrap" aria-label="功能">
      <a href="#orders" data-view="orders"><span class="t-long">叫貨進度</span><span class="t-short">叫貨</span></a>
      <a href="#daily" data-view="daily"><span class="t-long">每日工作</span><span class="t-short">工作</span> <span class="badge acc" id="dailyBadge" hidden></span></a>
      <a href="#calendar" data-view="calendar">行事曆</a>
      <a href="#approvals" data-view="approvals">簽核 <span class="badge" id="apprBadge" hidden></span></a>
      <a href="#vendors" data-view="vendors"><span class="t-long">廠商產品查詢</span><span class="t-short">廠商</span></a>
      <a href="#users" data-view="users" id="usersTab" hidden><span class="t-long">人員與權限</span><span class="t-short">人員</span></a>
    </nav>
  </header>

  <main class="wrap">
    <div id="banner" class="banners"></div>

    <section id="view-orders" class="view" aria-label="叫貨進度">
      <div class="toolbar">
        <div class="daynav" role="group" aria-label="選擇叫貨日期">
          <button class="icon-btn" id="prevDay" type="button" aria-label="前一天">‹</button>
          <input type="date" id="day" aria-label="叫貨日期">
          <button class="icon-btn" id="nextDay" type="button" aria-label="後一天">›</button>
          <span class="dayinfo" id="dayinfo"></span>
          <button class="btn ghost sm" id="todayBtn" type="button">回到今天</button>
        </div>
        <div class="seg" role="group" aria-label="顯示範圍">
          <button type="button" data-scope="day">當日</button>
          <button type="button" data-scope="open">所有未結案</button>
          <button type="button" data-scope="all">全部</button>
        </div>
        <input type="search" id="oq" class="search" placeholder="搜尋單號、品名、廠商、申請人" aria-label="搜尋叫貨單">
        <button class="btn sm" id="exportBtn" type="button" title="把目前看板上的單據匯出成 Excel 可開的 CSV">匯出 CSV</button>
      </div>
      <div id="kpis" class="kpis"></div>
      <div id="hintbar" class="hintbar"></div>
      <div id="board" class="board"></div>
      <p id="boardNote" class="hint"></p>
    </section>

    <section id="view-daily" class="view" aria-label="每日工作" hidden>
      <div class="toolbar">
        <div class="daynav" role="group" aria-label="選擇工作日期">
          <button class="icon-btn" id="dprevDay" type="button" aria-label="前一天">‹</button>
          <input type="date" id="dday" aria-label="工作日期">
          <button class="icon-btn" id="dnextDay" type="button" aria-label="後一天">›</button>
          <span class="dayinfo" id="ddayinfo"></span>
          <button class="btn ghost sm" id="dtodayBtn" type="button">回到今天</button>
        </div>
        <div class="seg" id="dseg" role="group" aria-label="檢視" hidden>
          <button type="button" data-dmode="me">我的工作</button>
          <button type="button" data-dmode="team">團隊確認</button>
        </div>
        <span class="spacer"></span>
        <button class="btn" type="button" id="taskSetBtn" data-dact="settings" hidden>工作項目設定</button>
      </div>
      <div id="dailyBody" class="view"></div>
    </section>

    <section id="view-calendar" class="view" aria-label="行事曆" hidden>
      <div class="toolbar">
        <div class="daynav" role="group" aria-label="選擇月份">
          <button class="icon-btn" id="cprev" type="button" aria-label="上個月">‹</button>
          <h2 class="h2 cmonth" id="cmonthLabel" aria-live="polite"></h2>
          <button class="icon-btn" id="cnext" type="button" aria-label="下個月">›</button>
          <button class="btn ghost sm" id="ctodayBtn" type="button">回到今天</button>
        </div>
        <label class="tog" for="corders"><input type="checkbox" id="corders">顯示叫貨需求日</label>
        <span class="spacer"></span>
        <button class="btn primary" type="button" data-newev="">＋ 新增行程</button>
      </div>
      <div class="calwrap">
        <div id="calGrid" class="calgrid"></div>
        <aside id="calSide" class="agenda" aria-label="當天行程"></aside>
      </div>
    </section>

    <section id="view-approvals" class="view" aria-label="簽核" hidden>
      <div id="apprFlow" class="flow"></div>
      <div id="apprList" class="view"></div>
    </section>

    <section id="view-vendors" class="view" aria-label="廠商產品查詢" hidden>
      <div class="seg vseg" role="group" aria-label="檢視">
        <button type="button" data-vmode="products">產品比價</button>
        <button type="button" data-vmode="materials">原物料分析</button>
      </div>
      <div id="prodPane" class="view">
      <div class="toolbar">
        <input type="search" id="pq" class="search wide" placeholder="輸入品名、規格或分類，查哪些廠商有供應" aria-label="搜尋產品">
        <select id="pvendor" aria-label="篩選廠商"></select>
        <span class="spacer"></span>
        <span id="vendorTools" class="row" hidden>
          <button class="btn" type="button" data-add-vendor>新增廠商</button>
          <button class="btn" type="button" data-add-product>新增產品</button>
          <button class="btn" type="button" data-import>從 Excel 貼上匯入</button>
        </span>
      </div>
      <div id="cats" class="cats"></div>
      <div class="vgrid">
        <div id="presults" class="presults"></div>
        <aside class="vdir" aria-label="廠商名錄">
          <h3>廠商名錄 <span id="vcount"></span></h3>
          <div id="vlist" class="vlist"></div>
        </aside>
      </div>
      </div>
      <div id="matPane" class="view" hidden>
        <div class="toolbar">
          <input type="search" id="mq" class="search wide" placeholder="搜尋料號、品名、規格、供應廠商" aria-label="搜尋原料">
          <span class="spacer"></span>
          <button class="btn sm" type="button" data-mat-export title="把原物料分析匯出成 Excel 可開的 CSV">匯出 CSV</button>
          <span id="matTools" class="row" hidden>
            <button class="btn" type="button" data-add-mat>新增原料</button>
            <button class="btn" type="button" data-import-mat>從 Excel 貼上原料清單</button>
          </span>
        </div>
        <div id="matBody" class="view"></div>
      </div>
    </section>

    <section id="view-users" class="view" aria-label="人員與權限" hidden>
      <div class="toolbar">
        <div>
          <h2 class="h2">人員與權限</h2>
          <p class="hint">用 Gmail 加入同事，勾選每個人能做的事。名單內的人都能查看全部資料；權限決定能不能新增、簽核與修改。</p>
        </div>
        <span class="spacer"></span>
        <button class="btn primary" type="button" id="addUserBtn">＋ 新增人員</button>
      </div>
      <div id="userList"></div>
    </section>
  </main>
</div>

<dialog id="dlg" aria-label="詳細內容"></dialog>
<div id="toast" role="status" aria-live="polite" popover="manual" hidden></div>
</body>
</html>
